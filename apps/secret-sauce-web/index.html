<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Sauce</title>
<style>
  :root { --bg:#0b0d10; --panel:#14181d; --line:#232a32; --text:#e7ecf1; --dim:#8b96a3;
          --accent:#f5a524; --ok:#3ecf8e; --you:#1d2a3a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, system-ui, sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:17px; }
  header h1 span { color:var(--accent); }
  .badges { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .badge { font-size:12px; padding:3px 9px; border:1px solid var(--line); border-radius:99px; color:var(--dim); }
  .badge.on { color:var(--ok); border-color:#1f5a40; }
  main { flex:1; overflow-y:auto; padding:20px; }
  .wrap { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .msg { padding:12px 15px; border-radius:12px; background:var(--panel); border:1px solid var(--line); white-space:pre-wrap; }
  .msg:not(.user) { white-space:normal; }
  .md p { margin:0 0 8px; } .md ul { margin:0 0 8px; padding-left:20px; } .md h3 { margin:6px 0; font-size:15px; }
  .md table { border-collapse:collapse; margin:6px 0 10px; font-size:14px; display:block; overflow-x:auto; }
  .md th, .md td { border:1px solid var(--line); padding:4px 10px; text-align:left; }
  .md th { color:var(--dim); font-weight:600; }
  .md code { font:12px ui-monospace, Menlo, monospace; background:#0f1317; padding:1px 5px; border-radius:4px; color:var(--accent); }
  .msg.user { background:var(--you); align-self:flex-end; max-width:80%; }
  .steps { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .step { font:12px ui-monospace, Menlo, monospace; color:var(--dim); background:#0f1317; border:1px solid var(--line);
          border-radius:6px; padding:2px 7px; cursor:help; }
  .step.local { color:#9ecbff; }
  .step.bistro { color:var(--accent); }
  .card { border:1px solid #5a4a1f; background:#1c1810; border-radius:10px; padding:10px 13px; }
  .card b { color:var(--accent); }
  .card button { margin:8px 8px 0 0; }
  .empty { color:var(--dim); text-align:center; margin-top:12vh; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px; }
  footer { border-top:1px solid var(--line); padding:14px 20px; }
  form { max-width:820px; margin:0 auto; display:flex; gap:10px; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid var(--line);
             border-radius:10px; padding:11px 13px; font:inherit; height:48px; }
  button { background:var(--accent); color:#111; border:0; border-radius:10px; padding:0 18px; font-weight:600; cursor:pointer; min-height:34px; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); font-weight:500; padding:6px 12px; }
  button:disabled { opacity:.5; cursor:wait; }
  .thinking { color:var(--dim); font-style:italic; }
  @media (max-width:600px) { header { flex-wrap:wrap; } .badges { margin-left:0; } main, footer { padding:12px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Secret <span>Sauce</span></h1>
  <div class="badges" id="badges"></div>
</header>
<main><div class="wrap" id="log">
  <div class="empty" id="empty">
    <div>Your private analyst. The brain runs sealed in NEAR AI. Your data stays on this Mac.</div>
    <div class="chips">
      <button class="ghost" data-q="How did we do last month? Give me revenue, costs and profit.">Last month's P&amp;L</button>
      <button class="ghost" data-q="Is any cash missing from the drawer? Which shifts?">Cash drawer check</button>
      <button class="ghost" data-q="Which bills are unpaid and which look wrong?">Unpaid bills</button>
      <button class="ghost" data-q="What are my best and worst dishes?">Best and worst dishes</button>
    </div>
  </div>
</div></main>
<footer>
  <form id="f">
    <textarea id="q" placeholder="Ask about your restaurant…" autofocus></textarea>
    <button id="send">Ask</button>
  </form>
</footer>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
const history = [], session = Math.random().toString(36).slice(2, 10);

function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>'); }
function md(text) {
  const out = [], lines = text.split('\n'); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let h = '<table><tr>' + cells(rows[0]).map(c => '<th>' + inline(c) + '</th>').join('') + '</tr>';
      for (const r of rows.slice(1)) { if (/^[\s|:-]+$/.test(r)) continue; h += '<tr>' + cells(r).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>'; }
      out.push(h + '</table>'); continue;
    }
    if (/^\s*[-*] /.test(l)) {
      let h = '<ul>'; while (i < lines.length && /^\s*[-*] /.test(lines[i])) h += '<li>' + inline(lines[i++].replace(/^\s*[-*] /, '')) + '</li>';
      out.push(h + '</ul>'); continue;
    }
    const hm = l.match(/^#{1,4} (.*)/);
    out.push(hm ? '<h3>' + inline(hm[1]) + '</h3>' : (l.trim() ? '<p>' + inline(l) + '</p>' : ''));
    i++;
  }
  return out.join('');
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function scroll() { const m = document.querySelector('main'); m.scrollTop = m.scrollHeight; }

async function status() {
  try {
    const s = await (await fetch('/api/status')).json();
    const b = document.getElementById('badges'); b.innerHTML = '';
    b.append(el('span', 'badge' + (s.near_key ? ' on' : ''), 'NEAR · ' + s.model));
    b.append(el('span', 'badge' + (s.bistro ? ' on' : ''), s.bistro ? 'Odoo: ' + s.bistro_tools.length + ' tools' : 'Odoo: offline'));
    b.append(el('span', 'badge on', 'Memory: ' + Math.round(s.memory_chars / 1000) + 'k chars'));
  } catch (e) {}
}

function renderPending(pending) {
  document.querySelectorAll('.card').forEach(c => c.remove());
  for (const p of pending) {
    const c = el('div', 'card');
    c.append(el('b', null, 'NEAR wants to remember: '), document.createTextNode(p.note));
    if (p.reason) c.append(el('div', 'step', 'why: ' + p.reason));
    const yes = el('button', null, 'Approve'), no = el('button', 'ghost', 'Skip');
    yes.onclick = () => decide('/api/approve', p.id);
    no.onclick = () => decide('/api/reject', p.id);
    c.append(el('br'), yes, no);
    log.append(c);
  }
  scroll();
}
async function decide(url, id) {
  const r = await (await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) })).json();
  renderPending(r.pending); status();
}

async function ask(text) {
  document.getElementById('empty')?.remove();
  log.append(el('div', 'msg user', text));
  history.push({ role: 'user', content: text });
  const wait = el('div', 'msg thinking', 'NEAR is reading your data…'); log.append(wait); scroll();
  send.disabled = true;
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history, session }) });
    const d = await r.json();
    wait.remove();
    if (!r.ok) throw new Error(d.error || r.status);
    const m = el('div', 'msg');
    if (d.steps.length) {
      const s = el('div', 'steps');
      for (const st of d.steps) {
        const isB = st.tool.startsWith('bistro__');
        const chip = el('span', 'step ' + (isB ? 'bistro' : 'local'), (isB ? 'Odoo · ' + st.tool.slice(8) : 'Mac · ' + st.tool));
        chip.title = JSON.stringify(st.args) + '\n\n' + st.preview;
        s.append(chip);
      }
      m.append(s);
    }
    const body = el('div', 'md'); body.innerHTML = md(d.reply); m.append(body);
    log.append(m);
    history.push({ role: 'assistant', content: d.reply });
    renderPending(d.pending);
  } catch (e) {
    wait.remove(); log.append(el('div', 'msg', 'Error: ' + e.message));
  }
  send.disabled = false; scroll();
}

document.getElementById('f').onsubmit = e => { e.preventDefault(); const t = q.value.trim(); if (t) { q.value = ''; ask(t); } };
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => ask(b.dataset.q));
status();
</script>
</body>
</html>
