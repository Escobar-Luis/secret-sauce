<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Secret Sauce</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #0e0f11; --panel: #16181c; --panel2: #1d2025; --line: #2a2e35;
    --text: #e8e6e3; --muted: #9aa0a8; --accent: #e0a458; --ok: #4cc38a; --bad: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; text-decoration: none; }
  .badge.ok { color: var(--ok); border-color: #2d5f47; }
  .badge.bad { color: var(--bad); border-color: #5f2d2f; }
  button { font: inherit; cursor: pointer; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
  .ghost:hover { color: var(--text); }
  main { flex: 1; overflow-y: auto; }
  #list { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  .empty h2 { color: var(--text); font-weight: 600; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 13px; font-size: 13px; }
  .chip:hover { border-color: var(--accent); }
  .msg { margin: 18px 0; }
  .user { display: flex; justify-content: flex-end; }
  .user .bubble { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; max-width: 80%; white-space: pre-wrap; }
  .bot .body { padding: 2px 2px; overflow-x: auto; }
  .bot .body table { border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
  .bot .body th, .bot .body td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .bot .body th { background: var(--panel); }
  .bot .body code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bot .body a { color: var(--accent); }
  details.trace { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  details.trace summary { cursor: pointer; padding: 8px 12px; color: var(--muted); font-size: 13px; list-style: none; }
  details.trace summary::before { content: "▸ "; }
  details.trace[open] summary::before { content: "▾ "; }
  .call { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 13px; }
  .call .src { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .call .name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .call .args { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
  .call .rows { color: var(--muted); white-space: nowrap; }
  .call.err .rows { color: var(--bad); }
  .proposal { margin-top: 10px; border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
  .proposal .label { color: var(--accent); font-size: 12px; margin-bottom: 4px; }
  .proposal button { margin-top: 8px; background: var(--accent); color: #1a1206; border: none; border-radius: 7px; padding: 5px 12px; font-weight: 600; }
  .proposal button:disabled { background: var(--panel2); color: var(--ok); }
  .thinking { color: var(--muted); font-size: 14px; }
  .thinking::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .error { color: var(--bad); }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px 16px; }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  textarea { flex: 1; resize: none; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; font: inherit; min-height: 46px; max-height: 180px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .send { background: var(--accent); color: #1a1206; border: none; border-radius: 12px; padding: 0 18px; font-weight: 600; }
  .send:disabled { opacity: .5; cursor: default; }
  .note { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: 11.5px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Secret <span>Sauce</span></h1>
  <a id="tee" class="badge" target="_blank" rel="noopener" title="Checking NEAR attestation…">🔒 Private: NEAR Confidential TEE <span id="teeMark">…</span></a>
  <div class="spacer"></div>
  <button class="ghost" id="newChat" title="Save this chat as a lesson and start fresh">New chat</button>
</header>
<main id="scroller">
  <div id="list">
    <div class="empty" id="empty">
      <h2>Ask about your restaurant</h2>
      <div>NEAR reads your Bistro books and files privately, then answers.</div>
      <div class="chips">
        <button class="chip">Is anyone stealing from the cash drawer?</button>
        <button class="chip">Which dish should I retire?</button>
        <button class="chip">What bills are still unpaid?</button>
        <button class="chip">Is the business trending the right way?</button>
      </div>
    </div>
  </div>
</main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask Secret Sauce…" autofocus></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <div class="note">Your NEAR key stays on this Mac. Tools are read-only. Memory changes need your approval.</div>
</footer>
<script>
const $ = (s) => document.querySelector(s);
const list = $("#list"), input = $("#input"), sendBtn = $("#send"), scroller = $("#scroller");
let sessionId = null, busy = false;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => DOMPurify.sanitize(window.marked ? marked.parse(s || "") : esc(s));
const scrollDown = () => (scroller.scrollTop = scroller.scrollHeight);

function addUser(text) {
  $("#empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  list.appendChild(el);
  scrollDown();
}

function argText(args) {
  const parts = Object.entries(args || {}).map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`);
  return parts.join(", ") || "(no arguments)";
}

function rowsText(c) {
  if (c.error) return "error";
  if (c.rows === null || c.rows === undefined) return "result";
  return `${c.rows} row${c.rows === 1 ? "" : "s"}`;
}

function renderBot(el, turn) {
  let html = `<div class="body">${md(turn.answer)}</div>`;
  if (turn.trace?.length) {
    html += `<details class="trace"><summary>What NEAR looked at · ${turn.trace.length} tool call${turn.trace.length === 1 ? "" : "s"}</summary>`;
    for (const c of turn.trace) {
      html += `<div class="call ${c.error ? "err" : ""}"><span class="src">${esc(c.source)}</span>
        <div><span class="name">${esc(c.tool)}</span> <span class="args">${esc(argText(c.args))}</span></div>
        <span class="rows">${esc(rowsText(c))}</span></div>`;
    }
    html += `</details>`;
  }
  for (const p of turn.proposals || []) {
    html += `<div class="proposal"><div class="label">NEAR wants to remember this</div>${md(p.text)}
      <button data-id="${esc(p.id)}">Approve</button></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".proposal button").forEach((b) =>
    b.addEventListener("click", async () => {
      b.disabled = true;
      const r = await fetch("/api/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: b.dataset.id }) });
      b.textContent = r.ok ? "✓ Saved to memory" : "Failed";
    })
  );
}

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true;
  addUser(text);
  input.value = ""; input.style.height = "";
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = `<div class="thinking">NEAR is looking at your data</div>`;
  list.appendChild(el); scrollDown();
  const live = { calls: [], label: "NEAR is looking at your data" };
  const drawLive = () => {
    el.innerHTML = `<div class="thinking">${esc(live.label)}</div>` + (live.calls.length
      ? `<details class="trace" open><summary>What NEAR is looking at</summary>${live.calls.map((c) =>
          `<div class="call ${c.error ? "err" : ""}"><span class="src">${esc(c.source)}</span>
           <div><span class="name">${esc(c.tool)}</span> <span class="args">${esc(argText(c.args))}</span></div>
           <span class="rows">${c.done ? esc(rowsText(c)) : "running…"}</span></div>`).join("")}</details>`
      : "");
    scrollDown();
  };
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sessionId, message: text }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", finished = false;
    while (!finished) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.session_id) sessionId = ev.session_id;
        if (ev.type === "thinking") { live.label = ev.round === 1 ? "NEAR is planning" : "NEAR is reading the results"; drawLive(); }
        else if (ev.type === "tool_start") { live.calls.push({ ...ev }); live.label = `Running ${ev.tool}`; drawLive(); }
        else if (ev.type === "tool_done") { Object.assign(live.calls[live.calls.length - 1] || {}, ev, { done: true }); drawLive(); }
        else if (ev.type === "done") { renderBot(el, ev); finished = true; }
        else if (ev.type === "error") throw new Error(ev.error);
      }
    }
    if (!finished) throw new Error("The connection closed early.");
  } catch (e) {
    el.innerHTML = `<div class="error">Something went wrong: ${esc(e.message)}</div>`;
  } finally {
    busy = false; sendBtn.disabled = false; scrollDown(); input.focus();
  }
}

function endSession() {
  if (!sessionId) return;
  navigator.sendBeacon("/api/end", JSON.stringify({ session_id: sessionId }));
  sessionId = null;
}

$("#form").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => send(c.textContent)));
$("#newChat").addEventListener("click", () => { endSession(); location.reload(); });
window.addEventListener("pagehide", endSession);

fetch("/api/attestation").then((r) => r.json()).then((a) => {
  const tee = $("#tee");
  tee.href = a.url;
  tee.classList.add(a.ok ? "ok" : "bad");
  $("#teeMark").textContent = a.ok ? "✓" : "✗";
  tee.title = a.ok ? "Attestation report returned 200. Click to view it." : "Attestation check failed.";
}).catch(() => ($("#teeMark").textContent = "✗"));
</script>
</body>
</html>
